<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VR arithmetic view</title>
<link rel="stylesheet" href="../../assets/vendor/katex/katex.min.css"></head><body style="margin:8px;font-family:system-ui">
<!-- ?n=6&id=s470&step=5&speed=fast&dark=1 : the arithmetic narrator on one book solution -->
<div id="h" data-sbt-host style="min-height:40px"></div>
<script src="../../assets/vendor/katex/katex.min.js"></script>
<script>
const q = new URLSearchParams(location.search);
if (q.get('dark')) { document.documentElement.dataset.theme = 'dark'; document.body.style.background = '#020617'; }
const n = q.get('n') || '6';
['vr_viz', 'vr_engine', 'vr_auto', 'vr_arith', 'math_' + n + '_solutions'].forEach(f => document.write('<script src="../../js/' + f + '.js?' + Date.now() + '"><\/script>'));
</script>
<script>
window.addEventListener('load', () => {
  const S = window['MATH_' + n + '_SOLUTIONS'], id = q.get('id') || 's470', h = document.getElementById('h');
  const steps = S[id].steps.map(s => ({ text: s.en, m: s.m }));
  const spec = SBVR.arithSpec(steps, { q: '', given: '' }) || SBVR.bookRowsSpec(steps, { q: '', given: '' });
  window.__spec = spec;
  if (!spec) { h.textContent = 'neither narrator takes this solution'; return; }
  SBVR.specs[spec.id] = spec; h.dataset.vr = spec.id;
  setTimeout(() => window.dispatchEvent(new Event('scroll')), 50);
  setTimeout(() => { const t = h._t; if (!t) return; t.speed = q.get('speed') || 'fast'; t.el.querySelector('[data-act=speed]').value = t.speed; t.base = t.speed; t.go(+(q.get('step') || 0)); window.__ready = 1; }, 600);
});
</script></body></html>
