# Deploys "SpaceBook Web" to https://wantuch.pk/spacebook on every push to main (or by hand from the Actions tab).
#
# Repository secrets (GitHub > Settings > Secrets and variables > Actions > New repository secret):
#   FTP_USERNAME   FTP account whose home folder IS public_html/spacebook (cPanel > FTP Accounts > Directory column)
#   FTP_PASSWORD   its password
#   DB_PASSWORD    password of MySQL user tafseelk_spacebook on wantuch.pk
# Optional repository variables (same page, "Variables" tab) only if your setup differs:
#   FTP_SERVER (default s26.hosterpk.com: the name on the server's FTPS certificate, same machine as wantuch.pk)
#   FTP_SECURITY (default strict: the certificate is checked)  FTP_DIR (default ./)  FTP_PROTOCOL (default ftps)
#   DB_HOST (default localhost)  DB_NAME (default tafseelk_spacebook)  DB_USER (default tafseelk_spacebook)
#   SITE_URL (default https://wantuch.pk/spacebook)
name: Deploy SpaceBook

on:
  push:
    branches: [main]
    paths:
      - 'SpaceBook Web/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'SpaceBook Web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-spacebook
  cancel-in-progress: false

jobs:
  # Gate: nothing is uploaded unless the data and the app still hold together. Both scripts exit non-zero on any failure.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: validate (syntax, datasets, index.html wiring, rebuilt-book contract)
        working-directory: SpaceBook Web
        run: node tools/validate.js
      - name: smoke (loads the whole app, opens every rebuilt book and tab)
        working-directory: SpaceBook Web
        run: node --max-old-space-size=6144 tools/smoke.js
      - name: install dev tools (fake IndexedDB for the client tests; no browser download)
        working-directory: SpaceBook Web
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --no-audit --no-fund
      - name: client sync core (store, outbox, back-off, pull)
        working-directory: SpaceBook Web
        run: node tests/sync/unit.js

  # API tests on the PHP version the live host runs (7.4) with a scratch MySQL. Not yet a deploy gate:
  # continue-on-error until this job has been seen green once on GitHub, then add it to deploy.needs.
  php-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: curl, mbstring, pdo_mysql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP 8-only syntax check
        working-directory: SpaceBook Web
        run: node tools/php74_lint.js
      - name: API tests (migrations, auth hardening, rate limits, devices)
        working-directory: SpaceBook Web
        env:
          SB_TEST_DB_HOST: 127.0.0.1
          SB_TEST_DB_USER: root
          SB_TEST_DB_PASS: root
        run: php tests/php/run.php
      - name: client + server end to end (lost answers, two devices, offline, revoked token)
        working-directory: SpaceBook Web
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          SB_TEST_DB_HOST: 127.0.0.1
          SB_TEST_DB_USER: root
          SB_TEST_DB_PASS: root
        run: |
          npm ci --no-audit --no-fund
          node tests/sync/e2e.js
          node --max-old-space-size=4096 tests/sync/rewards.js
          node --max-old-space-size=4096 tests/sync/planner.js
          node --max-old-space-size=4096 tests/sync/testprep.js

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://wantuch.pk/spacebook' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          missing=""
          for s in FTP_USERNAME FTP_PASSWORD DB_PASSWORD; do [ -n "${!s}" ] || missing="$missing $s"; done
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets (Settings > Secrets and variables > Actions):$missing"
            exit 1
          fi

      - name: Write api/config.php
        env:
          DB_HOST: ${{ vars.DB_HOST || 'localhost' }}
          DB_NAME: ${{ vars.DB_NAME || 'tafseelk_spacebook' }}
          DB_USER: ${{ vars.DB_USER || 'tafseelk_spacebook' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          php -r 'echo "<?php\n// Written by .github/workflows/deploy.yml from repository secrets.\nreturn " . var_export([
            "db_host" => getenv("DB_HOST"), "db_name" => getenv("DB_NAME"), "db_user" => getenv("DB_USER"),
            "db_pass" => getenv("DB_PASSWORD"), "db_port" => 3306], true) . ";\n";' > "SpaceBook Web/api/config.php"
          php -l "SpaceBook Web/api/config.php"

      - name: Upload to wantuch.pk
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.FTP_SERVER || 's26.hosterpk.com' }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          security: ${{ vars.FTP_SECURITY || 'strict' }}
          local-dir: ./SpaceBook Web/
          server-dir: ${{ vars.FTP_DIR || './' }}
          timeout: 600000
          # new name forces one full re-upload: the old state file no longer matched the files on the server
          state-name: .ftp-deploy-sync-state-v2.json
          # only the site goes up: pipelines, docs and dev files stay in the repository
          exclude: |
            **/.git*
            **/.git*/**
            docs/**
            tools/**
            kotlin/**
            .claude/**
            CONTRIBUTING.md
            exercise-pages.json
            biology-progress.json
            test_*.js
            tests/**
            node_modules/**
            package*.json
            api/.schema-*
            banner_kpk_academic.png

      - name: Check the live site
        run: |
          # 1) the app itself must be served: a 404 here means the FTP account uploads to a folder the web does not serve
          code=000
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$SITE_URL/index.html" || true)
            [ "$code" = 200 ] && break; sleep 6
          done
          if [ "$code" != 200 ]; then
            echo "::error::$SITE_URL/index.html returned HTTP $code after upload. The FTP account's home folder is not public_html/spacebook: in cPanel > FTP Accounts, set its Directory to public_html/spacebook (or set the FTP_DIR variable to the path from its home folder)."
            exit 1
          fi
          # 2) no package or secret may be reachable over HTTP
          for f in spacebook_upload.zip api/config.php.bak; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/$f" || true)
            if [ "$c" = 200 ]; then echo "::error::$SITE_URL/$f is publicly downloadable. Delete it from the server."; exit 1; fi
          done
          # 3) the API must reach the database
          curl -sS "$SITE_URL/api/health.php" | tee health.json; echo
          if ! grep -q '"db":true' health.json; then
            echo "::error::The site is served, but api/health.php does not report a working database: $(head -c 300 health.json). Check DB_PASSWORD and that user tafseelk_spacebook has ALL PRIVILEGES on tafseelk_spacebook."
            exit 1
          fi
          echo "Live: $SITE_URL"
